# Planul echipei UI Shapeshifter: o intrare pe task.
#
# Omul scrie PLANUL (taskuri, dependențe, cine), scriptul scrie STAREA (graful de pe branch-ul `dag`).
# Schimbările se fac printr-un PR la acest fișier.
#
# Câmpuri:
#   id          obligatoriu, unic
#   owner       A–E, exact numele din comms (A Mihnea, B Ștefan R., C Adelin, D Cezar, E Iulia)
#   title       ce înseamnă taskul, pe scurt
#   depends_on  id-uri care trebuie să fie gata înainte
#   branch      branch-ul pe care lucrezi; când are commit-uri împinse, taskul apare „în lucru”
#   pr          numărul PR-ului, dacă vrei să-l legi direct
#   status      auto (dedus) sau forțat: done / progress / ready / wait / blocked
#   note        ținta de timp și ce înseamnă „gata”
#
# Hackathon: vineri 14:00 → sâmbătă 14:00. Îngheț funcții: sâmbătă 09:00. Trimitere: sâmbătă 13:30.
# Contractele: specs/ și packages/contracts/.

