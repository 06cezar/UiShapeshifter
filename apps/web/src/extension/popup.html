<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <title>UI Shapeshifter</title>
    <style>
      :root {
        --uis-font: system-ui, -apple-system, "Segoe UI", sans-serif;
        --uis-bg: #1f2430;
        --uis-fg: #ffffff;
        --uis-muted: #c8ccd6;
        --uis-accent: #ff8a3d;
        --uis-ok: #4cc38a;
        --uis-warn: #f2c94c;
        --uis-error: #ff6b6b;
        --uis-space: 8px;
      }
      body {
        margin: 0;
        width: 280px;
        padding: calc(var(--uis-space) * 2);
        font: 16px/1.5 var(--uis-font);
        background: var(--uis-bg);
        color: var(--uis-fg);
      }
      h1 {
        margin: 0 0 var(--uis-space);
        font-size: 18px;
      }
      p {
        margin: 0 0 var(--uis-space);
      }
      .muted {
        color: var(--uis-muted);
      }
      .dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: var(--uis-space);
        border-radius: 50%;
        background: var(--uis-warn);
      }
      .dot[data-status="open"] {
        background: var(--uis-ok);
      }
      button {
        min-height: 44px;
        width: 100%;
        margin: var(--uis-space) 0;
        font: inherit;
        color: var(--uis-bg);
        background: var(--uis-accent);
        border: none;
        border-radius: 999px;
        cursor: pointer;
      }
      h2 {
        font-size: 16px;
        margin: calc(var(--uis-space) * 2) 0 var(--uis-space);
      }
      label {
        display: block;
        margin-top: var(--uis-space);
      }
      input {
        box-sizing: border-box;
        width: 100%;
        min-height: 44px;
        padding: 0 var(--uis-space);
        font: inherit;
        border-radius: 8px;
        border: 1px solid var(--uis-muted);
      }
      button.secondary {
        background: transparent;
        color: var(--uis-fg);
        outline: 2px solid var(--uis-muted);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .dot[data-status="closed"] {
        background: var(--uis-error);
      }
    </style>
  </head>
  <body>
    <h1>UI Shapeshifter</h1>
    <p role="status"><span class="dot" id="dot" aria-hidden="true"></span><span id="status">Se conectează…</span></p>
    <p class="muted">Utilizator anonim: <span id="user">–</span></p>
    <p class="muted">Pe fiecare site, jos în stânga, e butonul chatului: acolo îi spui agentului ce vrei.</p>
    <p id="site" class="muted"></p>
    <button type="button" id="reset" data-agent-id="popup.reset">Revino la original</button>
    <p id="reset-status" role="status" class="muted"></p>
    <button type="button" id="exclude" data-agent-id="popup.exclude">Nu schimba acest site</button>
    <p id="exclude-status" role="status" class="muted"></p>

    <section aria-labelledby="account-title" class="account">
      <h2 id="account-title">Cont (opțional)</h2>
      <p id="account-signed" class="muted" hidden></p>
      <button type="button" id="sign-out" class="secondary" data-agent-id="popup.sign-out" hidden>Ieși din cont</button>
      <form id="account-form">
        <p class="muted">
          Fără cont totul rămâne pe acest calculator. Cu cont, preferințele te urmează pe alt dispozitiv.
        </p>
        <label for="username">Nume</label>
        <input id="username" autocomplete="username" required minlength="3" maxlength="32" />
        <label for="password">Parolă</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" />
        <button type="submit" id="sign-in" data-agent-id="popup.sign-in">Intră în cont</button>
        <button type="button" id="register" class="secondary" data-agent-id="popup.register">Creează cont</button>
      </form>
      <p id="account-status" role="status" class="muted"></p>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
